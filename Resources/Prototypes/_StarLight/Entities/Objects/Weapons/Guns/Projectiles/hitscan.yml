- type: hitscan
  id: PointDefenseBeam
  name: Point Defense beam
  parent: LaserTrace
  maxLength: 30
  muzzleFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: pd_muzzle
  travelFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: pd_trace
  impactFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: pd_impact

# Apollo Heavy Laser - Devastating shuttle cannon laser
- type: entity
  id: ApolloHeavyLaser
  name: apollo heavy laser beam
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 250
        Structural: 100
  - type: HitscanBasicRaycast
    collisionMask: BulletImpassable
  - type: HitscanReflect
    reflectiveType: Energy
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_beam_heavy
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_heavy
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_beam_heavy
    bullet:
      sprite:
        sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
        state: heavylaser

