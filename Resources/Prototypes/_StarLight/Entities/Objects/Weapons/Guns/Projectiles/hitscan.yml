- type: hitscan
  id: PointDefenseBeam
  name: Point Defense beam
  parent: LaserTrace
  maxLength: 30
  muzzleFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: pd_muzzle
  travelFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: pd_trace
  impactFlash:
    sprite: _Starlight/Objects/Weapons/Guns/Projectiles/projectiles.rsi
