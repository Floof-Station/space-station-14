- type: entity
  abstract: true
  id: BaseDebugPowerLink
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer: [MobMask, Opaque]
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: LinkKey
    key: DebugPowerLink

- type: entity
  parent: BaseDebugPowerLink
  id: DebugPowerLinkInput
  name: power link input
  suffix: DEBUG
  description: Draws power from its HV network for its linked output.
  components:
  - type: Sprite
    sprite: Structures/Power/power.rsi
    state: wiredmachine
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerConsumer
    voltage: High
    node: input
    drawRate: 0
  - type: PowerLink
    direction: Input
  - type: PowerMonitoringDevice
    group: Consumer
    loadNode: input
    sprite: Structures/Power/power.rsi
    state: wiredmachine

- type: entity
  parent: BaseDebugPowerLink
  id: DebugPowerLinkOutput
  name: power link output
  suffix: DEBUG
  description: Supplies its HV network with whatever its linked input receives.
  components:
  - type: Sprite
    sprite: Structures/Power/power.rsi
    state: provider
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    voltage: High
    node: output
    supplyRate: 0
    supplyRampRate: 50000
    supplyRampTolerance: 500
  - type: PowerLink
    direction: Output
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/power.rsi
    state: provider

- type: entity
  abstract: true
  id: BaseDebugGasLinkPipe
  name: gas link pipe
  suffix: DEBUG
  description: Shares its pipe's gas with the matching pipe on the linked end.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Visibility
    layer: 1
  - type: SubFloorHide
  - type: Sprite
    drawdepth: ThinPipe
    visible: false
  - type: Appearance
  - type: PipeAppearance
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
  - type: AtmosPipeLayers
    spriteRsiPaths: {}
    pipeLayersLocked: true
  - type: AtmosDevice
  - type: GasLink

- type: entity
  parent: BaseDebugGasLinkPipe
  id: DebugGasLinkPipe1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeHalf
      color: "#FF4040"
  - type: AtmosPipeLayers
    pipeLayer: 0
  - type: LinkKey
    key: DebugGasLink1

- type: entity
  parent: BaseDebugGasLinkPipe
  id: DebugGasLinkPipe2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeHalf
      color: "#40FF40"
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 1
  - type: AtmosPipeLayers
    pipeLayer: 1
  - type: LinkKey
    key: DebugGasLink2

- type: entity
  parent: BaseDebugGasLinkPipe
  id: DebugGasLinkPipe3
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt2.rsi
      state: pipeHalf
      color: "#4080FF"
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 2
  - type: AtmosPipeLayers
    pipeLayer: 2
  - type: LinkKey
    key: DebugGasLink3

- type: entity
  id: DebugGasLink
  name: gas link
  suffix: DEBUG
  description: Spawns three gas link pipes, one per pipe layer.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Structures/Piping/Atmospherics/gascanisterport.rsi
    state: gasCanisterPort
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 100
        mask:
        - ItemMask
  - type: Pullable
  - type: Rotatable
  - type: AnchoredChildEntities
    childPrototypes:
    - prototype: DebugGasLinkPipe1
    - prototype: DebugGasLinkPipe2
    - prototype: DebugGasLinkPipe3

- type: entity
  parent: BaseStaticPortal
  id: DebugStaticPortal
  suffix: DEBUG
  components:
  - type: Sprite
    layers:
    - state: portal-blue
  - type: PointLight
    color: SkyBlue
    radius: 3
    energy: 1
    netsync: false
  - type: LinkKey
    key: DebugStaticPortal
