- type: entity
  abstract: true
  id: BaseDebugPowerLink
  name: power link
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer: [MobMask, Opaque]
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: LinkKey
    key: DebugPowerLink

- type: entity
  parent: BaseDebugPowerLink
  id: DebugPowerLinkInput
  suffix: DEBUG, Input
  description: Draws power from its HV network for its linked output.
  components:
  - type: Sprite
    sprite: Structures/Power/power.rsi
    state: wiredmachine
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerConsumer
    voltage: High
    node: input
    drawRate: 0
  - type: PowerLink
    direction: Input

- type: entity
  parent: BaseDebugPowerLink
  id: DebugPowerLinkOutput
  suffix: DEBUG, Output
  description: Supplies its HV network with whatever its linked input receives.
  components:
  - type: Sprite
    sprite: Structures/Power/power.rsi
    state: provider
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerSupplier
    voltage: High
    node: output
    supplyRate: 0
    supplyRampRate: 50000
    supplyRampTolerance: 500
  - type: PowerLink
    direction: Output
