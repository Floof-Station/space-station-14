- type: entity
  parent: BaseStaticPortal
  id: FathomGatePortal
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: portal-blue
  - type: PointLight
    color: SkyBlue
    radius: 3
    energy: 1
    netsync: false

- type: entity
  parent: BaseGasLinkPipe
  id: FathomGateGasPipe1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeHalf
  - type: AtmosPipeLayers
    pipeLayer: 0

- type: entity
  parent: BaseGasLinkPipe
  id: FathomGateGasPipe2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeHalf
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 1
  - type: AtmosPipeLayers
    pipeLayer: 1

- type: entity
  parent: BaseGasLinkPipe
  id: FathomGateGasPipe3
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt2.rsi
      state: pipeHalf
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        pipeLayer: 2
  - type: AtmosPipeLayers
    pipeLayer: 2

- type: entity
  id: FathomGatePower
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: NodeContainer
    examinable: true
    nodes:
      link:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerConsumer
    voltage: High
    node: link
    drawRate: 0
  - type: PowerSupplier
    voltage: High
    node: link
    supplyRate: 0
    supplyRampRate: 50000
    supplyRampTolerance: 500
  # both ends start as input, switching one to output is part of setting up the link
  - type: PowerLink
    direction: Input
  - type: PowerMonitoringDevice
    group: Generator
    sourceNode: link
    loadNode: link
    sprite: Structures/Machines/Anomaly/anomaly_generator.rsi
    state: base

- type: entity
  id: FathomGate
  name: fathom gate
  description: An ancient looking device with a huge hole in the center and several access ports.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Machines/Anomaly/anomaly_generator.rsi
    offset: 0,1
    drawdepth: Mobs
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: SpriteFade
    alwaysFade: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.5,1.5,0.6"
        density: 50
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: LinkKey
    key: FathomGate
  - type: FathomGate
  - type: Battery
    netsync: false
    maxCharge: 1000000
    startingCharge: 0
  - type: ExaminableBattery
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: BatteryCharger
    voltage: High
    node: input
  - type: PowerNetworkBattery
    maxSupply: 0
    maxChargeRate: 50000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: PowerMonitoringDevice
    group: SMES
    sourceNode: input
    loadNode: input
    sprite: Structures/Machines/Anomaly/anomaly_generator.rsi
    state: base
  - type: AnchoredChildEntities
    # these need to be the same for all gate types or the link won't work.
    childPrototypes:
    - prototype: FathomGatePortal
      offset: 0,-1
    - prototype: FathomGateGasPipe1
      offset: -1,0
    - prototype: FathomGateGasPipe2
      offset: -1,0
    - prototype: FathomGateGasPipe3
      offset: -1,0
    - prototype: FathomGatePower
      offset: 1,0

- type: entity
  parent: BaseItem
  id: FathomCatalyst
  name: fathom catalyst
  description: Opens the link between two fully charged fathom gates. Consumed in the process.
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/Cores/bluespace_core.rsi
    state: core
  - type: Item
    size: Small
  - type: FathomCatalyst
