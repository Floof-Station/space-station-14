  name: Origin Station sign
  components:
  - type: DecalLayoutSpawner
    decals:
    - decal: OriginStationSign1
      offset: -3,0
    - decal: OriginStationSign2
      offset: -2,0
    - decal: OriginStationSign3
      offset: -1,0
    - decal: OriginStationSign4
      offset: 0,0
    - decal: OriginStationSign5
      offset: 1,0
    - decal: OriginStationSign6
      offset: 2,0
    - decal: OriginStationSign7
      offset: 3,0
    - decal: OriginStationSign8
      offset: -1,1
    - decal: OriginStationSign9
      offset: 0,1
    - decal: OriginStationSign10
      offset: 1,1
    - decal: OriginStationSign11
      offset: -1,-1
    - decal: OriginStationSign12
