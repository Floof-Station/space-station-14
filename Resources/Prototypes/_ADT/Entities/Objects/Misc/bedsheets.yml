- type: entity
  parent: BaseItem
  id: DoubleBedsheetBase
  name: DoubleBedsheetBase
  abstract: true
  description: Large soft bedsheet for double bed.
  placement:
    mode: SnapgridCenter
    snap:
    - Bed
  components:
  - type: Sprite
    sprite: _ADT/Objects/Misc/bedsheets_double.rsi
    noRot: true
  - type: Item
    size: Small
  - type: StaticPrice
    price: 24
  - type: Tag
    tags:
    - Bedsheet
  - type: DirectionalBedsheet

