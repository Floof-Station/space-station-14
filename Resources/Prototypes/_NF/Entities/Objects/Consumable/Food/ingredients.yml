#TODO: Change this to not make a BAG for no reason
- type: entity
  parent: ReagentPacketBase
  id: ReagentContainerRaisin
  name: raisin bag
  description: A big bag of raisins. Good for baking!
  components:
    - type: Sprite
      sprite: _DV/Objects/Consumable/Food/ingredients.rsi
      state: raisin-big
    - type: Solution
      solution:
        maxVol: 50
        reagents:
          - ReagentId: Raisins
            Quantity: 50

- type: entity
  name: light roasted coffee beans
  parent: FoodProduceBase
  id: FoodCoffeeBeansRoastedLight
  description: Cinnamon roast coffee beans. Bright and fruity.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Edible
  - type: Solution
    id: food
    solution:
      maxVol: 15 # Floof
      reagents:
      - ReagentId: GroundCoffeeLight # Floof
        Quantity: 15
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-light
  - type: Item # Floof
    heldPrefix: produce-beans-light
  - type: Tag
    tags:
    - Fruit
  - type: Construction
    graph: Coffee
    node: light roasted coffee
    defaultTarget: medium roasted coffee
  - type: Fixtures # Floof
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 1 # Floof
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Temperature
    thermalConductivity: 1
    heatCapacity: 250 # Floof - had to convert this due to upstream change, Arbitrarily chosen
  - type: TemperatureDamage
    # required for cooking to work
  - type: InternalTemperature
  - type: Extractable
    grindableSolutionName: food

- type: entity
  name: medium roasted coffee beans
  parent: FoodCoffeeBeansRoastedLight
  id: FoodCoffeeBeansRoastedMedium
  description: City roast coffee beans. Smooth and nutty.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-medium
  - type: Item # Floof
    heldPrefix: produce-beans-medium
  - type: Construction
    graph: Coffee
    node: medium roasted coffee
    defaultTarget: dark roasted coffee
  - type: Solution # Floof
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: GroundCoffeeMedium
        Quantity: 15

- type: entity
  name: dark roasted coffee beans
  parent: FoodCoffeeBeansRoastedLight
  id: FoodCoffeeBeansRoastedDark
  description: Viennese roast coffee beans. Smoky and spicy.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-dark
  - type: Item # Floof
    heldPrefix: produce-beans-dark
  - type: Construction
    graph: Coffee
    node: dark roasted coffee
    defaultTarget: burnt coffee # Floof
  - type: Solution # Floof
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: GroundCoffeeDark
        Quantity: 15

# Floof
- type: entity
  name: burnt coffee beans
  parent: FoodCoffeeBeansRoastedLight
  id: FoodCoffeeBeansBurnt
  description: Roasted well past French and into charcoal. Oily, charred and ashy; this will brew a miserable cup.
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
    state: produce-beans-burnt
  - type: Item
    heldPrefix: produce-beans-burnt
  - type: Construction
    graph: Coffee
    node: burnt coffee
    defaultTarget: null
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: GroundCoffeeBurnt
        Quantity: 15
