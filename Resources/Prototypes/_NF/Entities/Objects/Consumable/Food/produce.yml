- type: entity
  name: pear
  parent: FoodProduceBase
  id: FoodPear
  description: It's peary good.
  components:
  - type: FlavorProfile
    flavors:
    - pear
  - type: Solution
    id: food
    solution:
      maxVol: 15
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 5
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/pear.rsi
  - type: Item # Floof
    heldPrefix: produce
  - type: Produce
    plantId: pear
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: coffee berries
  parent: FoodProduceBase
  id: FoodCoffee
  description: Red berries encasing coffee beans.
  components:
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Edible
  - type: Solution
    id: food
    solution:
      maxVol: 12
      reagents:
      - ReagentId: Nutriment
        Quantity: 2
      - ReagentId: Theobromine
        Quantity: 1
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/coffee.rsi
  - type: Item # Floof
    heldPrefix: produce
  - type: Produce
    plantId: coffee
  - type: Tag
    tags:
    - Fruit
  - type: Construction # Floof
    graph: Coffee
    node: start
    defaultTarget: light roasted coffee
  - type: AtmosExposed # Floof
  - type: Fixtures # Floof
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 1
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Temperature # Floof
    thermalConductivity: 1
    heatCapacity: 250
  - type: TemperatureDamage # Floof
    # required for cooking to work
  - type: InternalTemperature # Floof

- type: entity
  parent: [ FoodProduceBase, BaseSlicingRefinableFood ]
  id: FoodAvocado
  name: avocado
  description: Like delicious buttery grass.
  components:
  - type: FlavorProfile
    flavors:
    - avocado
  - type: Solution
    id: food
    solution:
      maxVol: 16
      reagents:
      - ReagentId: Nutriment #place holder
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 6
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/avocado.rsi
  - type: Item # Floof
    heldPrefix: produce
  - type: Produce
    plantId: avocado
  - type: ToolRefinable
    refineResult:
    - id: FoodAvocadoSlice
      amount: 2
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: OilVegetable
        Quantity: 5
  - type: Tag
    tags:
    - Fruit

- type: entity
  name: avocado slice
  parent: ProduceSliceBase
  id: FoodAvocadoSlice
  description: Like delicious, fun-sized buttery grass.
  components:
  - type: FlavorProfile
    flavors:
    - avocado
  - type: Solution
    id: food
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Vitamin
        Quantity: 3
  - type: Sprite
    sprite: _NF/Objects/Specific/Hydroponics/avocado.rsi
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: OilVegetable
        Quantity: 2.5
  - type: Tag
    tags:
    - Fruit
    - Slice

