# Coffee
- type: reagent
  id: ReagentBadCoffee
  name: reagent-name-bad-coffee
  desc: reagent-desc-bad-coffee
  physicalDesc: reagent-physical-desc-aromatic
  flavor: FlavorBadCoffee
  color: "#664300"
  recognizable: true
  metabolisms:
    Digestion:
      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 0.5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 4 # Eh, might as well give bad coffee a use.
        type: Remove
      metabolites:
        Theobromine: 0.1

- type: reagent
  id: ReagentQualityCoffee
  name: reagent-name-quality-coffee
