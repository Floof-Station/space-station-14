      effects:
      - !type:Satiate
        satiationType: Thirst
        factor: 2
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Remove
      metabolites:
        Theobromine: 0.05 # Less poison so more creatures can enjoy it.
