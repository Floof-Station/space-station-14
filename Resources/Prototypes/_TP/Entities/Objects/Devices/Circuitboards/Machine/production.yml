- type: entity
  parent: BaseMachineCircuitboard
  id: TP14OvenMachineCircuitboard
  name: oven machine board
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: TP14KitchenOven
    stackRequirements:
      Manipulator: 2
      Glass: 4
      Cable: 4
  - type: Tag
    tags:
    - TP14TagOvenMachineBoard

- type: entity
  id: CoffeeMakerCircuitboard
  parent: BaseMachineCircuitboard
  name: coffee maker machine board
  components:
    - type: Sprite
      state: service
    - type: MachineBoard
      prototype: CoffeeMaker
      stackRequirements:
        Manipulator: 3
        Steel: 20
        Cable: 6
    - type: Tag
      tags:
      - TagCoffeeMakerBoard
