- type: entity
  parent: VendingMachine
  id: VendingMachineBeachDrobe
  name: BeachDrobe
  description: The beaches may be artificial, but you still should dress up for them!
  components:
  - type: VendingMachine
    pack: BeachDrobeInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: Vocalizer
  - type: DatasetVocalizer
    dataset: BeachDrobeAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Impstation/Structures/Machines/VendingMachines/beachdrobe.rsi #beachdrobe? drobe or vend?
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#6cfffa"
