- type: entity
  parent: [ClothingSwimsuitBase]
  id: ClothingSwimsuitBlack
  name: black and white swimsuit
  description: Prevents sunburns specifically on your face!
  components:
  - type: Sprite
    sprite: _Impstation/Clothing/Uniforms/Other/Swimsuits/swimsuit_black.rsi
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-open
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _Impstation/Clothing/Uniforms/Other/Swimsuits/swimsuit_black.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodSwimsuitBlack 
    requiredSlot:
    - innerclothing
    slot: head
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: open
  - type: ContainerContainer #greycloak has this and greycloak also has folding and hood functions #seeing if this fixes testfail
    containers:
      toggleable-clothing: !type:ContainerSlot {}

- type: entity
