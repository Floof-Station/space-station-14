# Base benches
- type: entity
  name: bench
  id: BenchBaseMiddle
  suffix: Middle
  abstract: true
  parent: [ SeatBase, StructureHealthFurniture ] # Floof
  description: Multiple seats spanning a single object. Truly a marvel of science.
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    state: middle

# Floof-start
- type: entity
  abstract: true
  id: BenchWoodBase
  components:
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -3
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 0
            max: 1

- type: entity
  abstract: true
  id: BenchSteelBase
  components:
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1

- type: entity
  abstract: true
  id: BenchSofaBase
  components:
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
          MaterialCloth1:
            min: 0
            max: 1

- type: entity
  abstract: true
  parent: StructureHealthFurniture
  id: BenchCornerBase
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: StaticPrice
    price: 50
# Floof-end

# Park benches
- type: entity
  name: park bench
  id: BenchParkMiddle
  parent: [ BenchBaseMiddle, BenchWoodBase ] # Floof
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _DV/Structures/Furniture/Bench/parkbench_wooden.rsi
  - type: Construction
    graph: Bench
    node: BenchParkMiddle

- type: entity
  id: BenchParkLeftDV
  suffix: Left
  parent: BenchParkMiddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: left
  - type: Construction
    graph: Bench
    node: BenchParkLeftDV

- type: entity
  id: BenchParkRightDV
  suffix: Right
  parent: BenchParkMiddle
  placement:
    mode: SnapgridCenter
  components:
